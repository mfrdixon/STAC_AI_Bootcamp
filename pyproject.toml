[project]
name = "stac-ai-bootcamp"
version = "0.1.0"
description = "STAC AI Bootcamp"
readme = "README.md"
authors = [
    { name = "Matthew Dixon", email = "mfrdixon@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "mcp>=2.3.0",
    "openai>=3.35.1",
    "sentencepiece>=0.2.3",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[project.scripts]
stac-ai-bootcamp = "stac_ai_bootcamp:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = [ "src" ]
testpaths = ["tests"]
addopts = "-n 4 -q -rA"

[tool.ruff.lint]
ignore = ["BLE001", "DTZ011"]

[tool.ruff.lint.isort]
lines-after-imports = 2
